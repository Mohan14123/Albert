openapi: 3.0.0
info:
  title: Albert AI Assistant API
  version: 1.0.0
  description: API documentation for the Albert AI Assistant Backend and AI Microservices.

servers:
  - url: http://localhost:8000
    description: Backend API Server
  - url: http://localhost:8001
    description: AI API Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /api/v1/auth/google-login:
    post:
      summary: Google OAuth Login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string

  /api/v1/chats:
    get:
      summary: List User Chats
      tags:
        - Chats
      responses:
        '200':
          description: A list of chats
    post:
      summary: Create a Chat
      tags:
        - Chats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        '201':
          description: Chat created

  /api/v1/chats/{chat_id}/messages:
    post:
      summary: Send a message to a chat
      tags:
        - Messages
      parameters:
        - in: path
          name: chat_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
      responses:
        '201':
          description: Message queued

  /api/v1/chats/{chat_id}/messages/stream:
    get:
      summary: Stream AI response via SSE
      tags:
        - Messages
      parameters:
        - in: path
          name: chat_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSE Stream
          content:
            text/event-stream:
              schema:
                type: string
