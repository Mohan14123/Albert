name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

env:
  ENVIRONMENT: "local"
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  POSTGRES_DB: "test"
  POSTGRES_USER: "test"
  POSTGRES_PASSWORD: "test"
  REDIS_URL: "redis://localhost:6379/0"
  RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
  JWT_SECRET: "super-secret-key-that-is-at-least-32-characters-long"
  TOKEN_ENCRYPTION_KEY: "sG6n4hOhuaZGwJxdngCDiXN7DkVaz5COU8ApKQ_i8Z4="
  AI_SERVICE_URL: "http://localhost:8000"
jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # explicitly install types-redis and other stubs if needed for mypy
          
      - name: Run Ruff (Linting)
        run: ruff check app tests
        
      - name: Run Black (Formatting Check)
        run: black --check app tests
        
      - name: Run Mypy (Type Checking)
        run: mypy app

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pytest
        run: pytest tests/ -v

  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Image
        run: docker build -t albert-backend:test -f docker/backend.Dockerfile .
        
      - name: Build Worker Image
        run: docker build -t albert-worker:test -f docker/worker.Dockerfile .
