[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B008", "E501", "B904", "E712", "N818", "UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["arg-type", "assignment", "no-untyped-def", "no-untyped-call", "no-any-return", "type-arg", "return-value", "valid-type", "misc"]
files = ["app"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
